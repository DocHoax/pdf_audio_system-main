version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: echodoc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-echodoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-echodoc_secret}
      POSTGRES_DB: ${POSTGRES_DB:-echodoc_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-echodoc} -d ${POSTGRES_DB:-echodoc_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - echodoc_network

  # Redis Message Broker & Cache
  redis:
    image: redis:7-alpine
    container_name: echodoc_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - echodoc_network

  # FastAPI Backend API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: echodoc_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-echodoc}:${POSTGRES_PASSWORD:-echodoc_secret}@postgres:5432/${POSTGRES_DB:-echodoc_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-super-secret-development-key-change-in-production-12345}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - TTS_PROVIDER=${TTS_PROVIDER:-mock}
      - AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY:-}
      - AZURE_SPEECH_REGION=${AZURE_SPEECH_REGION:-}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - YARNGPT_API_KEY=${YARNGPT_API_KEY:-}
      - STORAGE_TYPE=local
      - LOCAL_STORAGE_PATH=/app/storage
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
    networks:
      - echodoc_network

  # Celery Asynchronous Conversion Workers
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: echodoc_worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-echodoc}:${POSTGRES_PASSWORD:-echodoc_secret}@postgres:5432/${POSTGRES_DB:-echodoc_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-super-secret-development-key-change-in-production-12345}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - TTS_PROVIDER=${TTS_PROVIDER:-mock}
      - AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY:-}
      - AZURE_SPEECH_REGION=${AZURE_SPEECH_REGION:-}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - YARNGPT_API_KEY=${YARNGPT_API_KEY:-}
      - STORAGE_TYPE=local
      - LOCAL_STORAGE_PATH=/app/storage
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - echodoc_network

  # Next.js Web Frontend
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: echodoc_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NODE_ENV=production
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
    networks:
      - echodoc_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local

networks:
  echodoc_network:
    driver: bridge

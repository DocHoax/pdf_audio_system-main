name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # Backend API & Worker Test Suite
  backend-tests:
    name: Backend Pytest & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: echodoc
          POSTGRES_PASSWORD: echodoc_password
          POSTGRES_DB: echodoc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (ffmpeg, tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-eng libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab')"

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: sqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-github-actions-ci-pipeline
          ENVIRONMENT: test
          TTS_PROVIDER: mock
          STORAGE_TYPE: local
        run: |
          cd apps/api
          pytest -v --tb=short tests/

  # Frontend Web Build & Lint
  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install Node Dependencies
        run: |
          cd apps/web
          npm ci || npm install

      - name: Run TypeScript Typecheck
        run: |
          cd apps/web
          npm run type-check

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: |
          cd apps/web
          npm run build

  # Multi-Container Docker Build Validation
  docker-validation:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Images with Docker Compose
        run: |
          docker compose build
